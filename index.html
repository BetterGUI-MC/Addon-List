<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BetterGUI Addon List</title>
        <style>
            :root {
                --bg: #f6f8fa; --card: #fff; --text: #1f2328; --muted: #656d76;
                --border: #d0d7de; --primary: #0969da; --success: #1a7f37; --community: #8c40bf;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --muted: #8b949e;
                    --border: #30363d; --primary: #2f81f7; --success: #3fb950; --community: #bc8cff;
                }
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.4; background: var(--bg); color: var(--text); padding: 0.5rem;
            }
            header, .controls, .filters, .addon-card, .card-header, .card-body, .card-actions, .btn { display: flex; }
            header, .card-header { justify-content: space-between; align-items: center; }
            header, .controls { margin-bottom: 0.5rem; }
            .addon-card, .card-body { flex-direction: column; }

            h1 { font-size: 1.15rem; font-weight: 600; }
            p { color: var(--muted); font-size: 0.75rem; }
            .github-link { opacity: 0.7; transition: opacity 0.2s; }
            .github-link:hover { opacity: 1; }

            .controls { gap: 0.5rem; }
            input[type="search"] {
                flex: 1; padding: 0.25rem 0.5rem; border: 1px solid var(--border);
                border-radius: 6px; background: var(--card); color: inherit; outline: none;
                font-size: 0.8rem;
            }
            .filters { gap: 0.25rem; }
            .btn {
                font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem;
                border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text);
                cursor: pointer; text-decoration: none; align-items: center; justify-content: center;
            }
            .btn:hover { background: var(--border); }
            .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
            .btn-active { background: var(--text); color: var(--bg); border: none; }

            .addon-card {
                background: var(--card); border: 1px solid var(--border); border-radius: 6px;
                padding: 0.5rem 0.75rem; gap: 0.4rem; height: 100%;
            }
            .card-title { font-size: 0.95rem; font-weight: 600; }
            .badge { font-size: 0.7rem; padding: 0.05rem 0.3rem; border-radius: 4px; font-weight: 500; }
            .badge-official { color: var(--success); border: 1px solid var(--success); }
            .badge-community { color: var(--community); border: 1px solid var(--community); }
            .version { font-size: 0.75rem; color: var(--muted); }
            .card-body { flex: 1; gap: 0.25rem; font-size: 0.825rem; color: var(--muted); }
            .card-actions { gap: 0.4rem; margin-top: 0.25rem; }
            
            #list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 0.4rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div style="display: flex; align-items: baseline; gap: 0.5rem;">
                    <h1>BetterGUI Addon List</h1>
                    <p>Curated addons for BetterGUI</p>
                </div>
                <a href="https://github.com/BetterGUI-MC/Addon-List" target="_blank" rel="noopener noreferrer" class="github-link" title="View Source on GitHub" aria-label="GitHub Repository">
                    <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" style="display: block; color: var(--text);">
                        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 01-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.35 2.69.91 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 010 8c0-4.42 3.58-8 8-8z"></path>
                    </svg>
                </a>
            </header>

            <nav class="controls">
                <input type="search" id="search" placeholder="Filter addons..." aria-label="Search">
                <div class="filters">
                    <button class="btn btn-active" data-type="all">All</button>
                    <button class="btn" data-type="official">Official</button>
                    <button class="btn" data-type="community">Community</button>
                </div>
            </nav>

            <main id="list">
                <div style="text-align: center; padding: 1rem; color: var(--muted); font-size: 0.8rem;">Loading addons...</div>
            </main>
        </div>

        <template id="tmpl-addon">
            <article class="addon-card">
                <header class="card-header">
                    <div>
                        <span class="card-title"></span>
                        <span class="badge"></span>
                    </div>
                    <span class="version"></span>
                </header>
                <div class="card-body">
                    <p class="desc"></p>
                    <p style="font-size: 0.7rem; margin-top: 0.15rem;">By <span class="authors"></span></p>
                </div>
                <footer class="card-actions">
                    <a class="btn btn-primary dl">Download</a>
                    <a class="btn src">Source</a>
                    <a class="btn wiki">Documentation</a>
                </footer>
            </article>
        </template>

        <script>
            let addons = {};
            let query = "", type = "all";

            const render = () => {
                const frag = document.createDocumentFragment();
                let count = 0;

                Object.entries(addons).forEach(([name, addon]) => {
                    const isOfficial = (addon["direct-link"] || "").startsWith("https://ci.codemc.io/job/BetterGUI-MC/");
                    const addonType = isOfficial ? "official" : "community";

                    if (type !== "all" && type !== addonType) return;

                    const authors = Array.isArray(addon.authors) ? addon.authors.join(", ") : (addon.authors || "Unknown");
                    const desc = addon.description || "No description.";

                    if (query && !`${name} ${desc} ${authors}`.toLowerCase().includes(query)) return;
                    count++;

                    const t = document.querySelector("#tmpl-addon").content.cloneNode(true);
                    t.querySelector(".card-title").textContent = name;
                    t.querySelector(".version").textContent = `v${addon.version || "1.0"}`;
                    t.querySelector(".desc").textContent = desc;
                    t.querySelector(".authors").textContent = authors;

                    const badge = t.querySelector(".badge");
                    badge.textContent = isOfficial ? "Official" : "Community";
                    badge.className = `badge badge-${addonType}`;

                    [["dl", "direct-link"], ["src", "source-code"], ["wiki", "wiki"]].forEach(([cls, key]) => {
                        const el = t.querySelector(`.${cls}`);
                        if (addon[key]) el.href = addon[key]; else el.remove();
                    });

                    frag.appendChild(t);
                });

                document.querySelector("#list").replaceChildren(count ? frag : Object.assign(document.createElement("div"), {
                    textContent: "No addons found.",
                    style: "text-align: center; padding: 1rem; color: var(--muted); font-size: 0.8rem;"
                }));
            };

            const init = async () => {
                document.querySelector("#search").oninput = (e) => {
                    query = e.target.value.toLowerCase().trim();
                    render();
                };

                document.querySelectorAll(".filters button").forEach(btn => {
                    btn.onclick = () => {
                        document.querySelector(".btn-active").classList.remove("btn-active");
                        btn.classList.add("btn-active");
                        type = btn.dataset.type;
                        render();
                    };
                });

                addons = await fetch("addons.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
                if (!addons) {
                    document.querySelector("#list").textContent = "Failed to load addons registry.";
                    return;
                }
                render();
            };

            init();
        </script>
    </body>
</html>
