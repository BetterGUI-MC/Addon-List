name: Update addons

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'addons.json'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: "false"

      - name: Build final file
        run: uv run main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: addons
          path: addons.json

      - name: Commit addons.json to main branch
        uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: "Update addons"
          add: addons.json

      - name: Prepare staging directory for web dashboard
        run: |
          mkdir -p staging
          cp index.html staging/
          cp addons.json staging/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
